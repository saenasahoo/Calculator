<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
         <link rel="stylesheet" href="style.css">
  </head>

<body>
    <div class="hero-box">
       
 <h1>CALCULATOR</h1>
  
 <div id="historyData"></div>
 
    </div>
    <div class="container">
      <input type="text">  
      <div class="keypad">
        <button value="(">(</button>
        <button value=")">)</button>
        <button value="AC">AC</button>
        <button value="history">
            <i class="fa-solid fa-clock-rotate-left"></i>
 </button>
        <button value="7">7</button>
        <button value="8">8</button>
        <button value="9">9</button>
        <button value="/"><i class="fa-solid fa-divide"></i></button>
        <button value="4">4</button>
        <button value="5">5</button>
        <button value="6">6</button>
        <button value="*"><i class="fa-solid fa-xmark"></i></button>
        <button value="1">1</button>
        <button value="2">2</button>
        <button value="3">3</button>
        <button value="4">-</button>
        <button value=".">.</button>
        <button value="0">0</button>
        <button value="del"><i class="fa-solid fa-delete-left"></i></button>
        <button id="plus" value="+">+</button>
        <button value="√"><i class="fa-solid fa-square-root-variable"></i></button>
      
        <button value="^">x^y</button>
        <button value="=">=</button>
      </div>
    </div>
    <script src="script.js"></script>
      
</body>
</html>
